{% load humanize %}{% if rows %}<table class="bs-table"><thead><tr><th>Code</th><th>Account</th><th style="text-align:right">Balance (NGN)</th></tr></thead><tbody>{% for item in rows %}<tr><td class="code">{{ item.account.code }}</td><td>{{ item.account.name }}</td><td class="amount">₦{{ item.balance|floatformat:2|intcomma }}</td></tr>{% endfor %}</tbody></table>{% else %}<div class="bs-empty">No balances recorded in this section as at the selected date.</div>{% endif %}
