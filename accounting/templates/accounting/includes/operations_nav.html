<style>
.ops-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:6px;background:#eaf0f7;border:1px solid #e0e7ef;border-radius:14px}
.ops-tab{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:10px;color:#475569;text-decoration:none;font-weight:800;font-size:.88rem}
.ops-tab:hover{background:#fff;color:#172033}
.ops-tab.active{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.ops-tab-icon{font-size:1rem}
.ops-hotel{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:15px 18px;background:#fff;border:1px solid #e1e7ef;border-radius:15px;box-shadow:0 5px 18px rgba(15,23,42,.03)}
.ops-hotel label{display:block;margin-bottom:6px;font-size:.75rem;font-weight:850;color:#475569}
.ops-hotel select{min-width:min(340px,80vw);height:42px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#172033;font:inherit}
.ops-hotel small{color:#64748b}
.ops-page{max-width:980px;margin:0 auto;padding:26px 26px 48px;color:#172033}
.ops-heading{margin:0 0 20px}.ops-kicker{font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:#64748b}.ops-heading h1{font-size:clamp(26px,3vw,34px);font-weight:850;letter-spacing:-.04em;margin:5px 0}.ops-heading p{color:#64748b;margin:6px 0 0}
.ops-panel{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:22px;box-shadow:0 5px 18px rgba(15,23,42,.035)}
.ops-field{margin-bottom:18px}.ops-field label{display:block;margin-bottom:7px;font-size:.88rem;font-weight:800;color:#334155}.ops-field input,.ops-field select,.ops-field textarea{display:block;width:100%;box-sizing:border-box;min-height:45px;padding:10px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#172033;font:inherit}.ops-field textarea{min-height:92px;resize:vertical}.ops-field input:focus,.ops-field select:focus,.ops-field textarea:focus,.ops-hotel select:focus{outline:3px solid rgba(37,99,235,.13);border-color:#2563eb}
.ops-submit{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 18px;border:0;border-radius:10px;background:#198754;color:#fff;font-weight:850;cursor:pointer}.ops-submit:hover{background:#157347}
.ops-hint{padding:13px 15px;margin-bottom:16px;border-radius:11px;background:#f1f5f9;color:#475569;font-size:.84rem;line-height:1.5}
@media(max-width:600px){.ops-page{padding:18px 12px 36px}.ops-panel{padding:16px}.ops-tabs{gap:4px}.ops-tab{flex:1;justify-content:center;padding:10px 8px;font-size:.8rem}.ops-hotel select{min-width:100%;width:100%}}
</style>
<nav class="ops-tabs" aria-label="Accounting operations">
  <a class="ops-tab {% if operations_active == 'bank_transfer' %}active{% endif %}" href="{% url 'accounting:bank_transfer' %}{% if hotel %}?hotel={{ hotel.id }}{% endif %}"><span class="ops-tab-icon">⇄</span> Bank Transfer</a>
  <a class="ops-tab {% if operations_active == 'cash_deposit' %}active{% endif %}" href="{% url 'accounting:cash_deposit' %}{% if hotel %}?hotel={{ hotel.id }}{% endif %}"><span class="ops-tab-icon">↓</span> Cash Deposit</a>
</nav>
{% if show_hotel_selector %}
<section class="ops-hotel">
  <div><label for="operations-hotel">Hotel for this operation</label><small>Select the hotel whose bank accounts and cash ledger should be used.</small></div>
  <form method="get"><select id="operations-hotel" name="hotel" onchange="this.form.submit()"><option value="">Choose a hotel…</option>{% for item in hotels %}<option value="{{ item.id }}" {% if hotel and item.id == hotel.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></form>
</section>
{% endif %}
