{% extends "base/base.html" %}

{% block title %}
Add Maintenance Supplier
{% endblock %}

{% block content %}

<h2>
    Add Maintenance Supplier
</h2>

<p>
    Add a supplier for Maintenance operations.
</p>

<div style="
    max-width:650px;
    padding:20px;
    background:white;
    border:1px solid #ddd;
    border-radius:6px;
">

<p>
    <strong>Hotel:</strong>
    {{ hotel.name }}
</p>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<br>

<button
    type="submit"
    class="btn btn-primary"
>
    Save Supplier
</button>

<a
    href="{% url 'maintenance_suppliers' %}"
    class="btn btn-secondary"
>
    Cancel
</a>

</form>

</div>

{% endblock %}
