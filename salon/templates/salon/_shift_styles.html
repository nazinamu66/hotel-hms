{% comment %}Shared styling for Salon shift and cash custody operational pages.{% endcomment %}
<style>
.salon-shift-page{max-width:1240px;margin:28px auto;padding:0 22px 40px;color:#172033}
.salon-shift-page *{box-sizing:border-box}
.salon-shift-page .page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.salon-shift-page h1{font-size:clamp(1.65rem,3vw,2.15rem);line-height:1.15;letter-spacing:-.04em;margin:0 0 8px;font-weight:800;color:#111827}
.salon-shift-page h2{font-size:1.2rem;letter-spacing:-.025em;margin:0 0 16px;font-weight:750;color:#172033}
.salon-shift-page .muted{color:#64748b}
.salon-shift-page .eyebrow{font-size:.75rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:#64748b;margin-bottom:8px}
.salon-shift-page .panel{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:22px;box-shadow:0 3px 12px rgba(15,23,42,.035)}
.salon-shift-page .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:20px 0}
.salon-shift-page .metric{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:17px 18px;min-height:108px;box-shadow:0 2px 8px rgba(15,23,42,.025)}
.salon-shift-page .metric-label{font-size:.83rem;color:#64748b;font-weight:600;margin-bottom:10px}
.salon-shift-page .metric-value{font-size:1.35rem;font-weight:800;letter-spacing:-.035em;color:#111827;overflow-wrap:anywhere}
.salon-shift-page .metric-note{font-size:.78rem;color:#94a3b8;margin-top:5px}
.salon-shift-page .status-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:750}
.salon-shift-page .status-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.salon-shift-page .status-open{background:#ecfdf5;color:#047857}
.salon-shift-page .status-closed{background:#f1f5f9;color:#475569}
.salon-shift-page .alert{padding:13px 16px;border:1px solid #bbf7d0;border-radius:12px;background:#f0fdf4;color:#166534;margin:0 0 20px}
.salon-shift-page .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 16px;font-weight:700;font-size:.9rem;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.salon-shift-page .btn:hover{transform:translateY(-1px)}
.salon-shift-page .btn-primary{background:#243449;color:#fff}
.salon-shift-page .btn-primary:hover{background:#17283c}
.salon-shift-page .btn-secondary{background:#fff;color:#334155;border-color:#cbd5e1}
.salon-shift-page .btn-danger{background:#b42318;color:#fff}
.salon-shift-page .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.salon-shift-page .field{display:flex;flex-direction:column;gap:7px}
.salon-shift-page label{font-size:.88rem;font-weight:650;color:#334155}
.salon-shift-page input,.salon-shift-page select,.salon-shift-page textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#172033;font:inherit}
.salon-shift-page input:focus,.salon-shift-page select:focus,.salon-shift-page textarea:focus{outline:3px solid rgba(59,130,246,.14);border-color:#3b82f6}
.salon-shift-page .table-wrap{overflow-x:auto}
.salon-shift-page table{width:100%;border-collapse:collapse;white-space:nowrap}
.salon-shift-page th{text-align:left;padding:12px 14px;background:#f8fafc;color:#64748b;font-size:.75rem;text-transform:uppercase;letter-spacing:.055em;font-weight:750}
.salon-shift-page td{padding:15px 14px;border-top:1px solid #edf0f4;font-size:.9rem;color:#334155}
.salon-shift-page tbody tr:hover{background:#fbfdff}
.salon-shift-page a.text-link{font-weight:750;color:#1d4ed8;text-decoration:none}
.salon-shift-page a.text-link:hover{text-decoration:underline}
.salon-shift-page .empty-state{text-align:center;padding:32px 18px;color:#64748b}
.salon-shift-page .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.salon-shift-page .section-gap{margin-top:20px}
@media(max-width:640px){.salon-shift-page{padding:0 14px 28px;margin:20px auto}.salon-shift-page .panel{padding:17px}.salon-shift-page .form-grid{grid-template-columns:1fr}.salon-shift-page .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.salon-shift-page .metric{padding:14px;min-height:96px}.salon-shift-page .metric-value{font-size:1.12rem}}
@media(max-width:390px){.salon-shift-page .metric-grid{grid-template-columns:1fr}}
</style>
