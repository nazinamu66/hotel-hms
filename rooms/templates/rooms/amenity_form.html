{% extends "base/base.html" %}

{% block title %}
    {% if amenity %}
        Edit Amenity
    {% else %}
        Add Amenity
    {% endif %}
{% endblock %}

{% block header %}
<h2>
    {% if amenity %}
        Edit Amenity
    {% else %}
        Add Amenity
    {% endif %}
</h2>
{% endblock %}

{% block content %}

<div class="card">

    <form method="post">

        {% csrf_token %}

        <label>
            Amenity Name
        </label>

        <br>

        <input
            type="text"
            name="name"
            value="{{ amenity.name|default:'' }}"
            required
        >

        <br><br>

        <label>
            Description
        </label>

        <br>

        <textarea
            name="description"
            rows="4"
        >{{ amenity.description|default:'' }}</textarea>

        <br><br>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save
        </button>

        <a
            href="{% url 'amenity_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
